<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="油滴与钻头标志">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123138"/>
      <stop offset="0.55" stop-color="#0a1e22"/>
      <stop offset="1" stop-color="#060f12"/>
    </linearGradient>
    <linearGradient id="brass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f0d9a4"/>
      <stop offset="0.38" stop-color="#cfa457"/>
      <stop offset="0.72" stop-color="#a9742c"/>
      <stop offset="1" stop-color="#7c521b"/>
    </linearGradient>
    <linearGradient id="dropShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e2" stop-opacity=".55"/>
      <stop offset="0.35" stop-color="#fff6e2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#5a3c12" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2125"/>
      <stop offset="1" stop-color="#060f12"/>
    </linearGradient>
  </defs>
  <!-- 底板：墨油黑圆角 -->
  <rect x="1" y="1" width="38" height="38" rx="11.5" fill="url(#tile)" stroke="#c79a54" stroke-opacity=".55"/>
  <rect x="2.2" y="2.2" width="35.6" height="35.6" rx="10.4" fill="none" stroke="#ffffff" stroke-opacity=".07"/>
  <!-- 同心勘探圈：科普感 -->
  <circle cx="20" cy="23" r="13.2" fill="none" stroke="#e8c98f" stroke-opacity=".14" stroke-width="1"/>
  <circle cx="20" cy="23" r="13.2" fill="none" stroke="#e8c98f" stroke-opacity=".35" stroke-width="1" stroke-dasharray="2.5 4.2"/>
  <!-- 油滴 -->
  <path d="M20 4.8c0 0-11.2 12.5-11.2 19.1 0 6.2 5 11.2 11.2 11.2s11.2-5 11.2-11.2C31.2 17.3 20 4.8 20 4.8Z" fill="url(#brass)"/>
  <path d="M20 4.8c0 0-11.2 12.5-11.2 19.1 0 6.2 5 11.2 11.2 11.2s11.2-5 11.2-11.2C31.2 17.3 20 4.8 20 4.8Z" fill="url(#dropShade)"/>
  <!-- 左侧高光 -->
  <path d="M14.9 15.2c-2.3 3-3.6 5.9-3.6 8.7 0 2.4.9 4.4 2.4 5.9-2.2-1.6-3.6-4.2-3.6-7 0-2.7 1.7-5.7 4.8-7.6Z" fill="#fff8e8" opacity=".5"/>
  <ellipse cx="15.6" cy="14.6" rx="1.1" ry="1.7" fill="#fffbeF" opacity=".65" transform="rotate(-24 15.6 14.6)"/>
  <!-- 井架剪影（钻探）：塔身 + 天车 + 钻杆 -->
  <g fill="url(#steel)">
    <path d="M17.2 17.5h5.6l1.5 9.6h-8.6Z" opacity=".94"/>
    <rect x="19.55" y="12.6" width=".9" height="15.6"/>
    <rect x="17" y="12.1" width="6" height="1.1" rx=".55"/>
    <circle cx="20" cy="11.3" r="1" fill="#0b1d20" stroke="#f0d9a4" stroke-width=".7" stroke-opacity=".8"/>
  </g>
  <g stroke="#f0d9a4" stroke-width=".55" opacity=".85">
    <path d="M17.6 19.6h4.8M17.9 21.7h4.2M18.2 23.8h3.6M18.5 25.9h3"/>
  </g>
  <!-- 钻头：三牙轮简化形 -->
  <path d="M17.4 27.1h5.2l-.7 2.1-1.2 1-.7 1.6-.7-1.6-1.2-1Z" fill="#0b1d20"/>
  <path d="M17.4 27.1h5.2l-.25.75h-4.7Z" fill="#e8c98f" opacity=".85"/>
  <!-- 油滴底部反光 -->
  <ellipse cx="20" cy="33.4" rx="4.6" ry="1.1" fill="#5a3c12" opacity=".35"/>
</svg>
